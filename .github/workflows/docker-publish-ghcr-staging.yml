# Build app image on push to staging → GHCR tag `staging` (+ commit SHA), then SSH redeploy.

name: docker-publish-ghcr-staging

on:
  push:
    branches: [staging]
    paths:
      - "prudential-atelier/**"
      - "deploy/**"
      - ".github/workflows/docker-publish-ghcr-staging.yml"
  workflow_dispatch:

concurrency:
  group: docker-publish-ghcr-staging
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: prudentgabriel

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DOCKER_CLIENT_TIMEOUT: "300"
      COMPOSE_HTTP_TIMEOUT: "300"
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase GHCR owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Add swap for Docker Next.js build
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 8

      - name: Set build-args for Next.js (staging URLs)
        run: |
          set_build_arg() {
            local name="$1"
            local secret_val="$2"
            local default_val="$3"
            if [ -n "$secret_val" ]; then
              echo "${name}=${secret_val}" >> "$GITHUB_ENV"
            else
              echo "${name}=${default_val}" >> "$GITHUB_ENV"
            fi
          }
          pick_secret() {
            local staging="$1"
            local prod="$2"
            local default="$3"
            if [ -n "$staging" ]; then printf '%s' "$staging"
            elif [ -n "$prod" ]; then printf '%s' "$prod"
            else printf '%s' "$default"
            fi
          }
          set_build_arg BUILD_NEXT_PUBLIC_APP_URL "${{ secrets.PA_BUILD_STAGING_NEXT_PUBLIC_APP_URL }}" "https://staging.prudentgabriel.com"
          set_build_arg BUILD_NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME "$(pick_secret "${{ secrets.PA_BUILD_STAGING_NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}" "${{ secrets.PA_BUILD_NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}" "")" ""
          set_build_arg BUILD_NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY "$(pick_secret "${{ secrets.PA_BUILD_STAGING_NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}" "${{ secrets.PA_BUILD_NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}" "")" ""
          set_build_arg BUILD_NEXT_PUBLIC_FLUTTERWAVE_PUBLIC_KEY "$(pick_secret "${{ secrets.PA_BUILD_STAGING_NEXT_PUBLIC_FLUTTERWAVE_PUBLIC_KEY }}" "${{ secrets.PA_BUILD_NEXT_PUBLIC_FLUTTERWAVE_PUBLIC_KEY }}" "")" ""
          set_build_arg BUILD_NEXT_PUBLIC_STRIPE_PUBLIC_KEY "$(pick_secret "${{ secrets.PA_BUILD_STAGING_NEXT_PUBLIC_STRIPE_PUBLIC_KEY }}" "${{ secrets.PA_BUILD_NEXT_PUBLIC_STRIPE_PUBLIC_KEY }}" "")" ""

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (retry on timeout)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin

      - uses: docker/build-push-action@v6
        with:
          context: prudential-atelier
          file: prudential-atelier/Dockerfile
          push: true
          build-args: |
            NODE_MEMORY_MB=4096
            NEXT_PUBLIC_APP_URL=${{ env.BUILD_NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ env.BUILD_NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY=${{ env.BUILD_NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
            NEXT_PUBLIC_FLUTTERWAVE_PUBLIC_KEY=${{ env.BUILD_NEXT_PUBLIC_FLUTTERWAVE_PUBLIC_KEY }}
            NEXT_PUBLIC_STRIPE_PUBLIC_KEY=${{ env.BUILD_NEXT_PUBLIC_STRIPE_PUBLIC_KEY }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=staging-v1
          cache-to: type=gha,mode=max,scope=staging-v1

      - name: Deploy staging via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_PAT,GITHUB_TOKEN,IMAGE_OWNER,GITHUB_SHA
          script: |
            set -euo pipefail
            TOKEN="${GHCR_PAT:-$GITHUB_TOKEN}"
            export DOCKER_CLIENT_TIMEOUT=300
            for attempt in 1 2 3 4 5; do
              if echo "$TOKEN" | docker login ghcr.io -u "${IMAGE_OWNER}" --password-stdin; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "GHCR login failed after 5 attempts" >&2
                exit 1
              fi
              echo "GHCR login attempt $attempt failed; retrying in 30s..." >&2
              sleep 30
            done
            cd /opt/prudentgabriel/deploy
            mkdir -p /opt/prudentgabriel/media-staging/public /opt/prudentgabriel/media-staging/private
            sudo -n chown -R 1001:1001 /opt/prudentgabriel/media-staging 2>/dev/null || chown -R 1001:1001 /opt/prudentgabriel/media-staging || true
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github.raw" \
                "https://api.github.com/repos/Nonyd/prudentgabriel/contents/deploy/compose.staging.yaml?ref=${GITHUB_SHA}" \
                -o /opt/prudentgabriel/deploy/compose.staging.yaml
              curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github.raw" \
                "https://api.github.com/repos/Nonyd/prudentgabriel/contents/deploy/backup-media.sh?ref=${GITHUB_SHA}" \
                -o /opt/prudentgabriel/deploy/backup-media.sh || true
              curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github.raw" \
                "https://api.github.com/repos/Nonyd/prudentgabriel/contents/deploy/restore-media.sh?ref=${GITHUB_SHA}" \
                -o /opt/prudentgabriel/deploy/restore-media.sh || true
              chmod 0755 /opt/prudentgabriel/deploy/backup-media.sh /opt/prudentgabriel/deploy/restore-media.sh || true
              mkdir -p /home/deploy/prudentgabriel-backups
              ( crontab -l 2>/dev/null | grep -v backup-media.sh || true; echo "15 2 * * * /opt/prudentgabriel/deploy/backup-media.sh" ) | crontab - || true
            fi
            # Pull only the app image from GHCR. A full `compose pull` also hits Docker Hub
            # for postgres:18-alpine and fails when Hub resets IPv6 connections.
            for attempt in 1 2 3 4 5; do
              if docker compose --env-file .env.staging -f compose.staging.yaml pull app; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "App image pull failed after 5 attempts" >&2
                exit 1
              fi
              echo "App image pull attempt $attempt failed; retrying in 30s..." >&2
              sleep 30
            done
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github.raw" \
                "https://api.github.com/repos/Nonyd/prudentgabriel/contents/deploy/republish-storefront-photos.sql?ref=${GITHUB_SHA}" \
                -o /tmp/pg-republish-storefront.sql
              docker cp /tmp/pg-republish-storefront.sql prudentgabriel-staging-postgres:/tmp/republish.sql
              docker exec prudentgabriel-staging-postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -f /tmp/republish.sql'
            fi
            docker compose --env-file .env.staging -f compose.staging.yaml up -d --force-recreate app
